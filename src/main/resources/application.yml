spring:
  application:
    name: cloud-cost-optimization-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/costplatform}
    username: ${DB_USERNAME:costplatform}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only verifies that entity mappings match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${IMPORT_MAX_FILE_SIZE:25MB}
      max-request-size: ${IMPORT_MAX_FILE_SIZE:25MB}
  mvc:
    problemdetails:
      enabled: true
  security:
    user:
      # A single operator account. Leave APP_ADMIN_PASSWORD unset only for local
      # experiments: Spring Boot then generates a random password and logs it.
      name: ${APP_ADMIN_USERNAME:admin}
      password: ${APP_ADMIN_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

costplatform:
  reporting-currency: ${COSTPLATFORM_REPORTING_CURRENCY:USD}
  aws:
    # Optional. When enabled, credentials come from the AWS SDK default provider chain;
    # never put access keys in configuration files.
    enabled: ${COSTPLATFORM_AWS_ENABLED:false}
    environment-tag-key: ${COSTPLATFORM_AWS_ENVIRONMENT_TAG_KEY:Environment}
    cost-metric: ${COSTPLATFORM_AWS_COST_METRIC:UnblendedCost}
    max-sync-days: 90
    scheduled-sync-enabled: ${COSTPLATFORM_AWS_SCHEDULED_SYNC_ENABLED:false}
    scheduled-sync-cron: "0 30 6 * * *"
    scheduled-sync-lookback-days: 7
