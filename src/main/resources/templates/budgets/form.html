<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${budgetId == null} ? 'New budget' : 'Edit budget')}"></head>
<body>
<div class="app">
  <nav th:replace="~{fragments/layout :: sidebar('budgets')}"></nav>
  <main class="content">
    <header class="page-header">
      <div>
        <h1 th:text="${budgetId == null} ? 'New budget' : 'Edit budget'">New budget</h1>
        <p class="subtitle">Spending is compared with the limit for the calendar period (UTC) containing the evaluation date.</p>
      </div>
    </header>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <section class="card">
      <form th:object="${budget}" method="post"
            th:action="${budgetId == null} ? @{/budgets} : @{/budgets/{id}(id=${budgetId})}">
        <div class="alert alert-error" role="alert" th:if="${#fields.hasErrors('*')}">Please correct the highlighted fields.</div>
        <div class="form-grid">
          <div class="form-row">
            <label for="name">Name</label>
            <input id="name" type="text" th:field="*{name}" maxlength="100" required>
            <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">error</span>
          </div>
          <div class="form-row">
            <label for="limitAmount" th:text="'Spending limit (' + ${@fmt.currencyCode()} + ')'">Spending limit</label>
            <input id="limitAmount" type="number" step="0.01" min="0.01" th:field="*{limitAmount}" required>
            <span class="field-error" th:if="${#fields.hasErrors('limitAmount')}" th:errors="*{limitAmount}">error</span>
          </div>
          <div class="form-row">
            <label for="period">Period</label>
            <select id="period" th:field="*{period}">
              <option th:each="p : ${periods}" th:value="${p}" th:text="${p.label()}">Monthly</option>
            </select>
            <span class="field-error" th:if="${#fields.hasErrors('period')}" th:errors="*{period}">error</span>
          </div>
          <div class="form-row">
            <label for="warningThresholdPercent">Warning threshold (% of limit)</label>
            <input id="warningThresholdPercent" type="number" min="1" max="100" th:field="*{warningThresholdPercent}" required>
            <span class="field-error" th:if="${#fields.hasErrors('warningThresholdPercent')}" th:errors="*{warningThresholdPercent}">error</span>
          </div>
          <div class="form-row">
            <label for="service">Service (optional)</label>
            <input id="service" type="text" list="service-options" th:field="*{service}" placeholder="All services">
            <datalist id="service-options">
              <option th:each="s : ${services}" th:value="${s}"></option>
            </datalist>
            <span class="field-error" th:if="${#fields.hasErrors('service')}" th:errors="*{service}">error</span>
          </div>
          <div class="form-row">
            <label for="environment">Environment (optional)</label>
            <input id="environment" type="text" list="environment-options" th:field="*{environment}" placeholder="All environments">
            <datalist id="environment-options">
              <option th:each="env : ${environments}" th:value="${@fmt.environment(env)}"></option>
            </datalist>
            <span class="field-error" th:if="${#fields.hasErrors('environment')}" th:errors="*{environment}">error</span>
          </div>
        </div>
        <div class="form-actions">
          <label class="checkbox"><input type="checkbox" th:field="*{active}"> Active</label>
        </div>
        <div class="form-actions">
          <button type="submit" class="button button-primary">Save budget</button>
          <a class="button" th:href="@{/budgets}">Cancel</a>
        </div>
      </form>
    </section>
  </main>
</div>
</body>
</html>
