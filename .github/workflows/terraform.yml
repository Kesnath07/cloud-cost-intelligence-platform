name: Terraform

on:
  push:
    branches: [main]
    paths: ["infra/terraform/**", ".github/workflows/terraform.yml"]
  pull_request:
    paths: ["infra/terraform/**", ".github/workflows/terraform.yml"]

permissions:
  contents: read

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra/terraform

      # No backend and no AWS credentials: this validates syntax, types and references only.
      - name: terraform validate
        run: |
          for dir in infra/terraform/bootstrap infra/terraform/app; do
            echo "::group::${dir}"
            terraform -chdir="${dir}" init -backend=false -input=false
            terraform -chdir="${dir}" validate
            echo "::endgroup::"
          done
